name: Build & Publish FlightSyte Docker Image

on:
  push:
    branches: [master]
    paths:
      - "**.py"
      - "Dockerfile"
      - "requirements.txt"
      - "terraform/**"
      
# Need ID token write permission to use OIDC
permissions:
  contents: read
  id-token: write
    
jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff (lint + import/order checks)
        run: ruff check .

      - name: Run Ruff formatter check
        run: ruff format --check .
        
  ecr:
    needs: lint-test
    runs-on: ubuntu-latest
    steps:   
      - name: Checkout repo
        uses: actions/checkout@v5
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@5.1.1
        with:
          aws-region: eu-north-1
          role-to-assume: arn:aws:iam::408852977582:role/git-accessor
          role-session-name: ECRSession
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push docker image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: my-ecr-repo
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG


