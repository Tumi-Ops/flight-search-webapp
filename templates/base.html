<body>
{% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-..."
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.accordion-button').forEach(btn => {
        btn.addEventListener('click', () => btn.blur());
    });
</script>
<script>
    let lastScroll = 0;
    const header = document.querySelector('.navbar-custom');
    const floatOffset = 20; // how far from top when floating

    window.addEventListener('scroll', () => {
        const currentScroll = window.pageYOffset;

        // scrolling down → dock to top
        if (currentScroll > lastScroll) {
            header.style.top = "0px";
        }
        // scrolling up → float again
        else {
            header.style.top = floatOffset + "px";
        }

        lastScroll = currentScroll;
    });
</script>
<div id="chatbot-container">
    <div id="chatbot-header">Ask FlightBot ✈️</div>

    <div id="chatbot-messages"></div>

    <div id="chatbot-input">
        <input type="text" id="chat-input" placeholder="Ask me about cities..." />
        <button onclick="sendMessage()">➤</button>
    </div>
</div>
<script>
function toggleChat() {
    const chat = document.getElementById("chatbot-container");
    chat.style.display = chat.style.display === "flex" ? "none" : "flex";
}

async function sendMessage() {
    const input = document.getElementById("chat-input");
    const message = input.value.trim();
    if (!message) return;

    appendMessage("user", message);
    input.value = "";

    const thinkingId = appendThinking();

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message })
        });

        const data = await response.json();

        removeThinking(thinkingId);

        if (!response.ok) {
            appendMessage("bot", data.error || "Something went wrong.");
            return;
        }

        appendMessage("bot", data.reply);

    } catch (error) {
        removeThinking(thinkingId);
        appendMessage("bot", "Network error. Please try again.");
    }
}

function appendThinking() {
    const container = document.getElementById("chatbot-messages");
    const msg = document.createElement("div");
    msg.className = "bot-thinking";
    msg.innerText = "FlightBot is thinking.";
    msg.id = "thinking-" + Date.now();
    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
    return msg.id;
}

function removeThinking(id) {
    const el = document.getElementById(id);
    if (el) el.remove();
}

function appendMessage(sender, text) {
    const container = document.getElementById("chatbot-messages");
    const msg = document.createElement("div");

    msg.classList.add("chat-message", sender);
    msg.innerText = text;

    container.appendChild(msg);
    container.scrollTop = container.scrollHeight;
}
</script>

<button id="chatbot-toggle" onclick="toggleChat()">💬</button>

</body>
</html>
